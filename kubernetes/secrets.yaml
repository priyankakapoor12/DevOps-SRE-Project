apiVersion: v1
kind: Secret
metadata:
  name: task-manager-secrets
type: Opaque
stringData:
  # IMPORTANT: Do not commit real secrets to Git!
  # Create secrets manually on the cluster:
  #
  # kubectl create secret generic task-manager-secrets \
  #     --from-literal=database-url="postgresql+psycopg://USER:PASS@RDS_ENDPOINT:5432/DB_NAME" \
  #     -n task-manager
  #
  # Or use AWS Secrets Manager with External Secrets Operator
  database-url: "REPLACE_WITH_ACTUAL_DATABASE_URL"
